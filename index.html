<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>虚拟现实</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="lang-switch" id="lang-switch"></div>
    <h1 class="book-title" id="book-title"></h1>
    <p class="toc-subtitle" id="toc-subtitle"></p>
    <ol class="toc" id="toc">
      <li class="status" id="toc-status"></li>
    </ol>
  </main>

  <script src="chapters.js"></script>
  <script>
    const lang = getLang();
    const book = BOOKS[lang];

    document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
    document.title = book.title;
    document.getElementById("book-title").textContent = book.title;
    document.getElementById("toc-subtitle").textContent = book.labels.subtitle;
    document.getElementById("toc-status").textContent = book.labels.loading;
    renderLangSwitch(document.getElementById("lang-switch"), lang);

    async function buildToc() {
      const toc = document.getElementById("toc");
      try {
        const titles = await Promise.all(
          book.files.map(async (file) => extractTitle(await fetchChapter(book, file)))
        );
        toc.innerHTML = "";
        if (titles.length === 0) {
          const li = document.createElement("li");
          li.className = "status";
          li.textContent = book.labels.empty;
          toc.appendChild(li);
          return;
        }
        titles.forEach((title, i) => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = withLang("chapter.html?n=" + (i + 1), lang);
          a.textContent = title || book.files[i];
          li.appendChild(a);
          toc.appendChild(li);
        });
      } catch (err) {
        toc.innerHTML = "";
        const li = document.createElement("li");
        li.className = "status";
        li.textContent = book.labels.tocError + err.message;
        toc.appendChild(li);
      }
    }
    buildToc();
  </script>

  <footer style="margin-top: 3em; padding: 1em 0; font-size: 0.85em; color: #888; text-align: center;">
    © 2026 Minmin Hou. Novel text licensed under
    <a href="https://creativecommons.org/licenses/by-nd/4.0/" style="color: inherit;">CC BY-ND 4.0</a>.
  </footer>
</body>
</html>
